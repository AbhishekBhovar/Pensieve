<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#101822"/>
<title>Pensieve Prototype</title>
<style>
:root{
  --night:#071019;
  --night2:#0b1620;
  --stone:#18242d;
  --stone2:#22323d;
  --text:#f2f5f6;
  --muted:#aab8c2;
  --faint:#778a97;
  --line:rgba(218,235,244,.13);
  --moon:#e4f3fa;
  --moon2:#b7d8e8;
  --glow:rgba(166,215,239,.22);
  --ink:#071018;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--text)}
body{
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(ellipse at 50% -5%, rgba(124,177,205,.17), transparent 30%),
    radial-gradient(circle at 14% 70%, rgba(82,123,148,.055), transparent 23%),
    radial-gradient(circle at 88% 82%, rgba(108,151,174,.045), transparent 25%),
    linear-gradient(180deg,#0d1924 0%,#09141d 44%,#061018 100%);
}
.shell{
  min-height:100svh;
  max-width:620px;
  margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 19px calc(30px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}
.atmosphere{
  position:relative;
  height:148px;
  flex:0 0 auto;
  pointer-events:none;
}
.brand{
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:.28em;
  font-size:12px;
  color:#d2dde3;
  text-shadow:0 0 18px rgba(204,235,249,.13);
}
.basin{
  position:absolute;
  left:50%;top:44px;
  transform:translateX(-50%);
  width:174px;height:72px;border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 44%,
      rgba(248,253,255,.96) 0%,
      rgba(205,234,247,.78) 12%,
      rgba(132,185,212,.53) 29%,
      rgba(59,102,127,.34) 48%,
      rgba(21,39,51,.40) 59%,
      rgba(7,16,25,0) 73%);
  filter:drop-shadow(0 0 24px rgba(163,216,240,.18));
}
.basin:before{
  content:"";
  position:absolute;
  left:19px;right:19px;top:15px;bottom:15px;
  border-radius:50%;
  border:1px solid rgba(232,247,253,.33);
  box-shadow:
    inset 0 -6px 12px rgba(5,13,20,.36),
    0 0 11px rgba(196,232,248,.09);
}
.basin:after{
  content:"";
  position:absolute;
  left:34px;right:34px;top:24px;bottom:24px;
  border-radius:50%;
  border:1px solid rgba(235,249,255,.20);
}
.wisp{
  position:absolute;
  left:50%;top:31px;
  width:2px;height:79px;
  border-radius:999px;
  background:linear-gradient(to top,rgba(233,248,255,.68),rgba(177,218,238,.28) 45%,transparent);
  transform-origin:bottom center;
  filter:blur(.25px) drop-shadow(0 0 4px rgba(196,232,249,.26));
  opacity:.35;
  animation:wisp 5.6s ease-in-out infinite;
}
.w1{transform:translateX(-1px) rotate(1deg)}
.w2{transform:translateX(-18px) rotate(-9deg);animation-delay:-1.8s}
.w3{transform:translateX(18px) rotate(10deg);animation-delay:-3.5s}
@keyframes wisp{
  0%,100%{opacity:.16;scale:.88;translate:0 5px}
  50%{opacity:.48;scale:1.05;translate:0 -4px}
}
.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  min-height:0;
  padding-top:9px;
}
.screen{
  width:100%;
  animation:arrive .36s cubic-bezier(.2,.7,.2,1);
}
@keyframes arrive{
  from{opacity:0;transform:translateY(9px)}
  to{opacity:1;transform:none}
}
.kicker{
  font-size:11px;
  letter-spacing:.17em;
  text-transform:uppercase;
  color:#8fa5b3;
  margin-bottom:9px;
}
h1,h2{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  margin:0;
  letter-spacing:-.012em;
  text-wrap:balance;
}
h1{font-size:31px;line-height:1.14}
h2{font-size:25px;line-height:1.24}
p{font-size:16.5px;line-height:1.62;margin:0}
.sub{
  color:var(--muted);
  font-size:15px;
  line-height:1.55;
  max-width:35em;
}
.stack{display:grid;gap:12px}
.space-lg{display:grid;gap:24px}
.choices{display:grid;gap:10px}
.choice{
  width:100%;
  min-height:58px;
  text-align:left;
  padding:15px 17px;
  border-radius:18px;
  border:1px solid rgba(216,234,243,.12);
  background:
    linear-gradient(180deg,rgba(38,57,70,.90),rgba(26,42,53,.93));
  color:#f0f4f6;
  font:inherit;
  font-size:16.5px;
  font-weight:560;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025),
    0 7px 22px rgba(0,0,0,.07);
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.choice:active{
  transform:scale(.985);
  border-color:rgba(210,238,250,.30);
  background:linear-gradient(180deg,rgba(51,76,91,.95),rgba(32,51,63,.95));
}
textarea{
  width:100%;
  min-height:118px;
  resize:vertical;
  border-radius:19px;
  border:1px solid rgba(217,236,245,.13);
  background:
    linear-gradient(180deg,rgba(27,43,54,.96),rgba(20,34,44,.96));
  color:var(--text);
  padding:16px 17px;
  font:inherit;
  font-size:16px;
  line-height:1.56;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
}
textarea::placeholder{color:#788b98}
textarea:focus{
  border-color:rgba(200,231,246,.34);
  box-shadow:0 0 0 3px rgba(178,220,241,.045),0 0 24px rgba(166,215,239,.035);
}
button{appearance:none;border:0;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.primary{
  width:100%;
  min-height:52px;
  border-radius:17px;
  background:linear-gradient(180deg,#edf8fc 0%,#d3eaf4 100%);
  color:var(--ink);
  font-weight:720;
  font-size:16.5px;
  padding:13px 17px;
  box-shadow:0 7px 22px rgba(123,185,213,.08),inset 0 1px 0 white;
}
.primary:active{transform:translateY(1px)}
.secondary{
  width:100%;
  min-height:50px;
  border-radius:17px;
  border:1px solid rgba(214,233,243,.13);
  background:rgba(27,43,54,.72);
  color:#e6edf1;
  font-weight:620;
  font-size:16px;
}
.textbutton{
  background:transparent;
  color:#adc2ce;
  font-size:14.5px;
  font-weight:600;
  padding:4px 0;
}
.reflection{
  position:relative;
  padding:3px 0 3px 17px;
  border-left:1px solid rgba(196,229,244,.34);
  color:#edf2f4;
}
.reflection:before{
  content:"";
  position:absolute;
  left:-2px;top:9px;
  width:3px;height:20px;border-radius:999px;
  background:#c8e6f4;
  box-shadow:0 0 12px rgba(188,226,244,.30);
}
.quote{
  position:relative;
  padding:5px 3px 5px 18px;
  border-left:1px solid rgba(205,234,247,.26);
}
.quote:before{
  content:"";
  position:absolute;
  width:5px;height:5px;border-radius:50%;
  left:-3px;top:16px;
  background:#d9eef8;
  box-shadow:0 0 12px rgba(198,232,247,.55);
}
.quote blockquote{
  font-family:Georgia,"Times New Roman",serif;
  font-size:20px;
  line-height:1.52;
  margin:0 0 10px;
  color:#f3f6f7;
}
.who{
  font-size:12.5px;
  color:#9eb0bb;
  letter-spacing:.055em;
}
.softnote{
  padding:16px 17px;
  border-radius:19px;
  background:
    linear-gradient(180deg,rgba(34,52,64,.78),rgba(25,40,50,.82));
  border:1px solid rgba(215,235,244,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}
.softnote strong{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  color:#c8d5dc;
  letter-spacing:.01em;
}
.softnote textarea{
  background:rgba(8,18,26,.25);
  border-color:rgba(215,235,244,.10);
}
.row{display:flex;gap:10px}
.row>*{flex:1}
.editline{
  margin-top:9px;
  display:inline-flex;
  align-items:center;
  background:transparent;
  color:#bcd6e3;
  font-size:14px;
  font-weight:650;
  padding:0;
}
.end-actions{display:grid;gap:10px}
.hidden{display:none!important}
@media(max-width:460px){
  .shell{padding-left:17px;padding-right:17px}
  .atmosphere{height:136px}
  .basin{top:42px;width:162px;height:67px}
  .stage{padding-top:4px}
  h1{font-size:29px}
  h2{font-size:23.5px}
  p{font-size:16px}
  .space-lg{gap:21px}
  .choice{min-height:56px;font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  .screen,.wisp{animation:none!important}
  .choice,.primary{transition:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <div class="atmosphere" aria-hidden="true">
    <div class="brand">PENSIEVE</div>
    <div class="basin"></div>
    <div class="wisp w1"></div>
    <div class="wisp w2"></div>
    <div class="wisp w3"></div>
  </div>
  <main id="stage" class="stage"></main>
</div>

<script>
const stage=document.getElementById('stage');

let state={
  category:"I've failed",
  short:"",
  deep:"",
  need:"",
  step:"Review my exam feedback and identify one recurring mistake.",
  takeaway:"One failed attempt doesn't answer what I'm capable of. I need to understand what didn't work rather than turn the result into a judgement about myself."
};

function render(html){stage.innerHTML=`<section class="screen">${html}</section>`}
function value(id){return (document.getElementById(id)?.value||"").trim()}

function home(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <h1>What’s on your mind?</h1>
        <p class="sub">You don’t need the right words. Start wherever you can.</p>
      </div>
      <div class="choices">
        ${["I'm overwhelmed","I'm grieving","I'm afraid","I've failed","I'm angry","I need motivation"].map(x=>`<button class="choice pick" data-v="${x}">${x}</button>`).join("")}
      </div>
    </div>`);
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{state.category=b.dataset.v;shortQuestion()})
}

function shortQuestion(){
  const failed=state.category==="I've failed";
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">I’m listening</div>
        <h2>${failed?"What happened?":"Tell me what happened."}</h2>
        <p class="sub">${failed?"Give me the short version. What do you mean when you say you’ve failed?":"Give me the short version — just enough for me to understand."}</p>
      </div>
      <textarea id="short" placeholder="Tell me the short version...">${failed?"I failed my exam again and I’m worried I won’t finish my degree.":""}</textarea>
      <button id="next" class="primary">Continue</button>
    </div>`);
  document.getElementById('next').onclick=()=>{state.short=value('short');summary()}
}

function summary(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">I understand</div>
        <p class="reflection">You’ve tried again, it hasn’t gone the way you hoped, and now you’re worried about what this could mean for finishing your degree.</p>
      </div>
      <div class="stack">
        <h2>Want to go a little deeper?</h2>
        <p class="sub">Tell me what feels most important — what hurt, what you’re worried this means, or anything else sitting with you.</p>
      </div>
      <div class="stack">
        <button id="deep" class="primary">Yes, let’s go deeper</button>
        <button id="skip" class="secondary">Not right now</button>
      </div>
    </div>`);
  document.getElementById('deep').onclick=deepDive;
  document.getElementById('skip').onclick=perspective;
}

function deepDive(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Take your time</div>
        <h2>What feels hardest about this?</h2>
        <p class="sub">You don’t need to organise it neatly. Just write what feels true.</p>
      </div>
      <textarea id="deep">I’m starting to wonder whether I’m actually capable of doing this. I’m embarrassed that I’ve failed again and I’m scared everyone else is moving forward while I’m stuck.</textarea>
      <button id="next" class="primary">Go deeper 〰</button>
    </div>`);
  document.getElementById('next').onclick=()=>{state.deep=value('deep');interpret()}
}

function interpret(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">What I think is underneath</div>
        <h2>This seems bigger than the exam.</h2>
      </div>
      <p class="reflection">You’re disappointed by the result, but what seems to hurt most is what you’re starting to make it mean about you — that maybe you’re not capable, or that you’re falling behind.</p>
      <p><strong>A failed attempt and being a failure are not the same thing.</strong></p>
      <div class="stack">
        <button id="persp" class="primary">See another perspective →</button>
        <button id="wrong" class="textbutton">Not quite</button>
      </div>
    </div>`);
  document.getElementById('persp').onclick=perspective;
  document.getElementById('wrong').onclick=notQuite;
}

function notQuite(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Tell me what I missed</div>
        <h2>What’s closer to the truth?</h2>
      </div>
      <textarea id="correction" placeholder="What’s really bothering me is..."></textarea>
      <button id="next" class="primary">That’s closer</button>
    </div>`);
  document.getElementById('next').onclick=perspective;
}

function perspective(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Another perspective</div>
        <p>Failing at something can tell you an attempt didn’t work. It can’t, by itself, tell you what you’re capable of.</p>
      </div>
      <div class="quote">
        <blockquote>“It ain’t about how hard you hit. It’s about how hard you can get hit and keep moving forward.”</blockquote>
        <div class="who">Rocky Balboa</div>
      </div>
      <p><strong>Maybe the important part isn’t whether you failed. It’s what you decide this failure means.</strong></p>
      <button id="next" class="primary">Bring it back to me</button>
    </div>`);
  document.getElementById('next').onclick=meaning;
}

function meaning(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Back to you</div>
        <h2>Which feels closest?</h2>
      </div>
      <div class="choices">
        <button class="choice m">This proves I can’t do it.</button>
        <button class="choice m">Something didn’t work, and I need to understand what.</button>
        <button class="choice m">I know it doesn’t prove I can’t do it — but it still feels that way.</button>
      </div>
      <textarea id="own" placeholder="Or put it in your own words..."></textarea>
      <button id="next" class="primary">Continue</button>
    </div>`);
  document.querySelectorAll('.m').forEach(b=>b.onclick=()=>document.getElementById('own').value=b.textContent);
  document.getElementById('next').onclick=need;
}

function need(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">What would help now?</div>
        <h2>What do you need most from this moment?</h2>
      </div>
      <div class="choices">
        <button class="choice n" data-n="understand">Understand why this attempt went wrong</button>
        <button class="choice n" data-n="confidence">Work through what this did to my confidence</button>
        <button class="choice n" data-n="next">Think about what I want to do next</button>
      </div>
    </div>`);
  document.querySelectorAll('.n').forEach(b=>b.onclick=()=>{state.need=b.dataset.n;support()});
}

function support(){
  if(state.need==="understand"){
    render(`
      <div class="space-lg">
        <div class="stack">
          <div class="kicker">Let’s understand it</div>
          <h2>What do you think actually went wrong?</h2>
          <p class="sub">Focus on the attempt, not on judging yourself.</p>
        </div>
        <textarea id="branch" placeholder="What I think went wrong is...">I don’t think I prepared in the right way. I studied, but I avoided the parts I found hardest.</textarea>
        <button id="next" class="primary">Look at this with me</button>
      </div>`);
    document.getElementById('next').onclick=understandFollowup;
    return;
  }
  if(state.need==="confidence"){
    render(`
      <div class="space-lg">
        <div class="stack">
          <div class="kicker">Your confidence took a hit</div>
          <h2>What are you doubting about yourself now?</h2>
          <p class="sub">What changed in the way you see yourself after this happened?</p>
        </div>
        <textarea id="branch" placeholder="What I’m doubting now is...">I’m starting to wonder if I’m actually smart enough to finish this degree.</textarea>
        <button id="next" class="primary">Help me look at this</button>
      </div>`);
    document.getElementById('next').onclick=confidenceFollowup;
    return;
  }
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">What comes next?</div>
        <h2>What options are you considering?</h2>
        <p class="sub">And what is making the next move hard to choose?</p>
      </div>
      <textarea id="branch" placeholder="The options I’m thinking about are...">I could review the feedback, ask for help, or change how I prepare — but I feel embarrassed and I don’t know where to start.</textarea>
      <button id="next" class="primary">Help me narrow it down</button>
    </div>`);
  document.getElementById('next').onclick=nextFollowup;
}

function understandFollowup(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">That gives us something useful</div>
        <h2>The result and the cause are not the same thing.</h2>
        <p>You’re not saying you were incapable. You’re identifying a part of the approach that may not have worked.</p>
        <p class="sub">That means there is something you can learn from — not just something to feel bad about.</p>
      </div>
      <button id="next" class="primary">Turn this into a 1% step</button>
    </div>`);
  document.getElementById('next').onclick=onePercent;
}

function confidenceFollowup(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">That’s the part worth looking at</div>
        <h2>The exam has started to feel like evidence about who you are.</h2>
        <p>But it can tell you how you performed on one attempt. It cannot measure the limits of what you’re capable of learning.</p>
      </div>
      <div class="stack">
        <h2>What would you need to see from yourself to start rebuilding some of that confidence?</h2>
        <textarea id="confidenceBuild" placeholder="I think I’d need to...">I think I need to prove to myself that I can understand the material instead of avoiding it because I’m embarrassed.</textarea>
      </div>
      <button id="next" class="primary">Make that 1% smaller</button>
    </div>`);
  document.getElementById('next').onclick=onePercent;
}

function nextFollowup(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Let’s make it clearer</div>
        <h2>You don’t have to choose the whole path today.</h2>
        <p>The useful question is which option gives you the clearest next piece of information or momentum.</p>
        <p class="sub">We can turn that into one small move instead of a major decision.</p>
      </div>
      <button id="next" class="primary">Find my 1% step</button>
    </div>`);
  document.getElementById('next').onclick=onePercent;
}

function onePercent(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Your one percent</div>
        <h2>What would moving just 1% in the right direction look like today?</h2>
        <p class="sub">One small positive move. Nothing more.</p>
      </div>
      <div class="choices">
        <button class="choice s">Review my exam feedback and identify one recurring mistake</button>
        <button class="choice s">Spend 10 minutes working out what went wrong</button>
        <button class="choice s">Write down one thing I’ll change next time</button>
        <button class="choice s">Ask someone for help with the part I’m stuck on</button>
      </div>
      <textarea id="custom" placeholder="Or choose your own 1% step..."></textarea>
      <button id="next" class="primary">This is my step for today</button>
    </div>`);
  document.querySelectorAll('.s').forEach(b=>b.onclick=()=>document.getElementById('custom').value=b.textContent);
  document.getElementById('next').onclick=()=>{
    state.step=value('custom')||state.step;
    takeaway();
  };
}

function takeaway(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Before we leave this here</div>
        <h2>What do you want to take with you?</h2>
        <p class="sub">I’ve suggested something below. Change any part of it until it feels like yours.</p>
      </div>
      <div class="softnote">
        <strong>What I’m taking with me</strong>
        <textarea id="takeInline" style="min-height:145px;margin-top:10px">${state.takeaway}</textarea>
      </div>
      <button id="next" class="primary">Keep going</button>
    </div>`);
  document.getElementById('next').onclick=()=>{
    state.takeaway=value('takeInline')||state.takeaway;
    resolution();
  };
}

function editTakeaway(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Make it yours</div>
        <h2>What do you want to remember?</h2>
      </div>
      <textarea id="take">${state.takeaway}</textarea>
      <button id="next" class="primary">Save this thought</button>
    </div>`);
  document.getElementById('next').onclick=()=>{
    state.takeaway=value('take')||state.takeaway;
    resolution();
  };
}

function resolution(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">For today</div>
        <h2>You don’t have to solve the whole future tonight.</h2>
        <p class="sub">Before you leave this here, you can still change either thought.</p>
      </div>

      <div class="softnote">
        <strong>What I’m taking with me</strong>
        <textarea id="finalTake" style="min-height:145px;margin-top:10px">${state.takeaway}</textarea>
      </div>

      <div class="softnote">
        <strong>My 1% step today</strong>
        <textarea id="finalStep" style="min-height:105px;margin-top:10px">${state.step}</textarea>
      </div>

      <button id="next" class="primary">Leave this in the Pensieve</button>
    </div>`);
  document.getElementById('next').onclick=()=>{
    state.takeaway=value('finalTake')||state.takeaway;
    state.step=value('finalStep')||state.step;
    memory();
  };
}

function editTakeawayFinal(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">One last change</div>
        <h2>What do you want to take with you?</h2>
      </div>
      <textarea id="take">${state.takeaway}</textarea>
      <button id="next" class="primary">Update it</button>
    </div>`);
  document.getElementById('next').onclick=()=>{
    state.takeaway=value('take')||state.takeaway;
    resolution();
  };
}

function editStepFinal(){

      <div class="stack">

function memory(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Leave the memory?</div>
        <h2>Keep what mattered — not just what hurt.</h2>
        <p class="sub">If this feeling returns, Pensieve can bring back what you understood and what helped.</p>
      </div>
      <div class="end-actions">
        <button id="keep" class="primary">Keep this memory</button>
        <button id="fade" class="secondary">Let it fade</button>
      </div>
    </div>`);
  document.getElementById('keep').onclick=kept;
  document.getElementById('fade').onclick=home;
}

function kept(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Memory kept</div>
        <h2>You can come back to this.</h2>
        <p class="sub">Not to relive the failure — to remember what you understood when you worked through it.</p>
      </div>
      <button id="home" class="primary">Return to Pensieve</button>
    </div>`);
  document.getElementById('home').onclick=home;
}

home();
