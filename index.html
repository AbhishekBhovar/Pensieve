<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#101822"/>
<title>Pensieve Prototype</title>
<style>
:root{
  --bg1:#0d1520;
  --bg2:#101b26;
  --bg3:#09111a;
  --text:#f2f5f7;
  --muted:#b4c1cb;
  --soft:#182632;
  --soft2:#203240;
  --line:rgba(220,235,244,.15);
  --silver:#d7edf8;
  --silver2:#9fc7dc;
  --ink:#071018;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg1);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -10%, rgba(151,199,224,.20), transparent 34%),
    radial-gradient(circle at 18% 74%, rgba(98,142,170,.08), transparent 25%),
    linear-gradient(180deg,var(--bg2) 0%,var(--bg1) 52%,var(--bg3) 100%);
}
.shell{
  min-height:100vh;
  max-width:640px;
  margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}
.atmosphere{position:relative;height:138px;flex:0 0 auto}
.brand{
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:.22em;
  font-size:13px;
  color:#c8d8e1;
}
.basin{
  position:absolute;
  left:50%;top:38px;transform:translateX(-50%);
  width:158px;height:70px;border-radius:50%;
  background:
    radial-gradient(ellipse at center,
      rgba(245,251,255,.92) 0%,
      rgba(189,221,238,.74) 18%,
      rgba(106,163,194,.42) 42%,
      rgba(35,65,83,.25) 58%,
      rgba(7,17,26,0) 72%);
  filter:drop-shadow(0 0 20px rgba(170,218,241,.18));
}
.basin:before,.basin:after{
  content:"";
  position:absolute;border-radius:50%;
  border:1px solid rgba(225,244,252,.28);
}
.basin:before{inset:18px 27px}
.basin:after{inset:25px 40px;opacity:.55}
.wisp{
  position:absolute;
  left:50%;top:31px;
  width:2px;height:68px;
  border-radius:999px;
  background:linear-gradient(to bottom,transparent,rgba(237,248,255,.78),transparent);
  transform-origin:bottom center;
  filter:blur(.2px);
  opacity:.5;
  animation:drift 4.8s ease-in-out infinite;
}
.w2{transform:translateX(-14px) rotate(-7deg);animation-delay:-1.4s}
.w3{transform:translateX(17px) rotate(8deg);animation-delay:-2.8s}
@keyframes drift{
  0%,100%{opacity:.25;scale:.92}
  50%{opacity:.62;scale:1.06}
}
.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:0;
}
.screen{animation:fade .24s ease}
@keyframes fade{from{opacity:.18;transform:translateY(7px)}to{opacity:1;transform:none}}
.kicker{
  font-size:12px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#9eb2bf;
  margin-bottom:10px;
}
h1,h2{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  margin:0;
}
h1{font-size:31px;line-height:1.12}
h2{font-size:25px;line-height:1.2}
p{
  font-size:17px;
  line-height:1.58;
  margin:0;
}
.sub{color:var(--muted);font-size:15.5px;line-height:1.5}
.stack{display:grid;gap:14px}
.space-lg{display:grid;gap:22px}
.choices{display:grid;gap:10px}
.choice{
  width:100%;
  min-height:60px;
  text-align:left;
  padding:15px 17px;
  border-radius:17px;
  border:1px solid rgba(211,231,241,.12);
  background:linear-gradient(180deg,rgba(37,55,68,.92),rgba(26,41,52,.92));
  color:var(--text);
  font:inherit;
  font-size:17px;
  font-weight:560;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  border-radius:18px;
  border:1px solid rgba(214,233,243,.14);
  background:rgba(23,37,48,.96);
  color:var(--text);
  padding:16px;
  font:inherit;
  font-size:16px;
  line-height:1.55;
  outline:none;
}
textarea:focus{
  border-color:rgba(198,229,244,.34);
  box-shadow:0 0 0 3px rgba(180,222,242,.05);
}
button{
  appearance:none;border:0;font:inherit;cursor:pointer;
}
.primary{
  width:100%;
  min-height:52px;
  border-radius:16px;
  background:linear-gradient(180deg,#e8f5fb,#cee6f2);
  color:var(--ink);
  font-weight:700;
  font-size:17px;
  padding:13px 16px;
}
.secondary{
  width:100%;
  min-height:50px;
  border-radius:16px;
  border:1px solid rgba(214,233,243,.15);
  background:rgba(24,38,49,.80);
  color:#e8eef2;
  font-weight:620;
  font-size:16px;
}
.textbutton{
  background:transparent;color:#b8c9d3;
  font-size:15px;font-weight:560;padding:8px 0;
}
.reflection{
  padding-left:16px;
  border-left:2px solid rgba(186,221,238,.28);
}
.quote{
  padding-left:16px;
  border-left:1px solid rgba(204,232,245,.27);
}
.quote blockquote{
  font-family:Georgia,"Times New Roman",serif;
  font-size:20px;line-height:1.5;margin:0 0 9px;
}
.who{font-size:13px;color:#9fb0bc;letter-spacing:.05em}
.softnote{
  padding:15px 16px;
  border-radius:16px;
  background:rgba(29,46,58,.78);
  border:1px solid rgba(215,234,243,.10);
}
.softnote strong{display:block;margin-bottom:6px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.editline{
  margin-top:9px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:transparent;
  color:#b9d2df;
  font-size:14px;
  font-weight:650;
  padding:0;
}
.end-actions{display:grid;gap:10px}
.hidden{display:none!important}
@media(max-width:460px){
  .shell{padding-left:16px;padding-right:16px}
  .atmosphere{height:120px}
  h1{font-size:29px}
  h2{font-size:24px}
  p{font-size:16px}
  .choice{font-size:16.5px;min-height:58px}
}
@media(prefers-reduced-motion:reduce){
  .screen,.wisp{animation:none}
}
</style>
</head>
<body>
<div class="shell">
  <div class="atmosphere" aria-hidden="true">
    <div class="brand">PENSIEVE</div>
    <div class="basin"></div>
    <div class="wisp w1"></div>
    <div class="wisp w2"></div>
    <div class="wisp w3"></div>
  </div>
  <main id="stage" class="stage"></main>
</div>

<script>
const stage=document.getElementById('stage');

let state={
  category:"I've failed",
  short:"",
  deep:"",
  need:"",
  step:"Review my exam feedback and identify one recurring mistake.",
  takeaway:"One failed attempt doesn't answer what I'm capable of. I need to understand what didn't work rather than turn the result into a judgement about myself."
};

function render(html){stage.innerHTML=`<section class="screen">${html}</section>`}
function value(id){return (document.getElementById(id)?.value||"").trim()}

function home(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <h1>What’s on your mind?</h1>
        <p class="sub">Start wherever you can.</p>
      </div>
      <div class="choices">
        ${["I'm overwhelmed","I'm grieving","I'm afraid","I've failed","I'm angry","I need motivation"].map(x=>`<button class="choice pick" data-v="${x}">${x}</button>`).join("")}
      </div>
    </div>`);
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{state.category=b.dataset.v;shortQuestion()})
}

function shortQuestion(){
  const failed=state.category==="I've failed";
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">I’m listening</div>
        <h2>${failed?"What happened?":"Tell me what happened."}</h2>
        <p class="sub">${failed?"Give me the short version. What do you mean when you say you’ve failed?":"Give me the short version — just enough for me to understand."}</p>
      </div>
      <textarea id="short" placeholder="Tell me the short version...">${failed?"I failed my exam again and I’m worried I won’t finish my degree.":""}</textarea>
      <button id="next" class="primary">Continue</button>
    </div>`);
  document.getElementById('next').onclick=()=>{state.short=value('short');summary()}
}

function summary(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">I understand</div>
        <p class="reflection">You’ve tried again, it hasn’t gone the way you hoped, and now you’re worried about what this could mean for finishing your degree.</p>
      </div>
      <div class="stack">
        <h2>Want to go a little deeper?</h2>
        <p class="sub">Tell me what feels most important — what hurt, what you’re worried this means, or anything else sitting with you.</p>
      </div>
      <div class="stack">
        <button id="deep" class="primary">Yes, let’s go deeper</button>
        <button id="skip" class="secondary">Not right now</button>
      </div>
    </div>`);
  document.getElementById('deep').onclick=deepDive;
  document.getElementById('skip').onclick=perspective;
}

function deepDive(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Take your time</div>
        <h2>What feels hardest about this?</h2>
        <p class="sub">You don’t need to organise it neatly. Just write what feels true.</p>
      </div>
      <textarea id="deep">I’m starting to wonder whether I’m actually capable of doing this. I’m embarrassed that I’ve failed again and I’m scared everyone else is moving forward while I’m stuck.</textarea>
      <button id="next" class="primary">Go deeper 〰</button>
    </div>`);
  document.getElementById('next').onclick=()=>{state.deep=value('deep');interpret()}
}

function interpret(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">What I think is underneath</div>
        <h2>This seems bigger than the exam.</h2>
      </div>
      <p class="reflection">You’re disappointed by the result, but what seems to hurt most is what you’re starting to make it mean about you — that maybe you’re not capable, or that you’re falling behind.</p>
      <p><strong>A failed attempt and being a failure are not the same thing.</strong></p>
      <div class="stack">
        <button id="persp" class="primary">See another perspective →</button>
        <button id="wrong" class="textbutton">Not quite</button>
      </div>
    </div>`);
  document.getElementById('persp').onclick=perspective;
  document.getElementById('wrong').onclick=notQuite;
}

function notQuite(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Tell me what I missed</div>
        <h2>What’s closer to the truth?</h2>
      </div>
      <textarea id="correction" placeholder="What’s really bothering me is..."></textarea>
      <button id="next" class="primary">That’s closer</button>
    </div>`);
  document.getElementById('next').onclick=perspective;
}

function perspective(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Another perspective</div>
        <p>Failing at something can tell you an attempt didn’t work. It can’t, by itself, tell you what you’re capable of.</p>
      </div>
      <div class="quote">
        <blockquote>“It ain’t about how hard you hit. It’s about how hard you can get hit and keep moving forward.”</blockquote>
        <div class="who">Rocky Balboa</div>
      </div>
      <p><strong>Maybe the important part isn’t whether you failed. It’s what you decide this failure means.</strong></p>
      <button id="next" class="primary">Bring it back to me</button>
    </div>`);
  document.getElementById('next').onclick=meaning;
}

function meaning(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Back to you</div>
        <h2>Which feels closest?</h2>
      </div>
      <div class="choices">
        <button class="choice m">This proves I can’t do it.</button>
        <button class="choice m">Something didn’t work, and I need to understand what.</button>
        <button class="choice m">I know it doesn’t prove I can’t do it — but it still feels that way.</button>
      </div>
      <textarea id="own" placeholder="Or put it in your own words..."></textarea>
      <button id="next" class="primary">Continue</button>
    </div>`);
  document.querySelectorAll('.m').forEach(b=>b.onclick=()=>document.getElementById('own').value=b.textContent);
  document.getElementById('next').onclick=need;
}

function need(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">What would help now?</div>
        <h2>What do you need most from this moment?</h2>
      </div>
      <div class="choices">
        <button class="choice n" data-n="understand">Understand why this attempt went wrong</button>
        <button class="choice n" data-n="confidence">Work through what this did to my confidence</button>
        <button class="choice n" data-n="next">Think about what I want to do next</button>
      </div>
    </div>`);
  document.querySelectorAll('.n').forEach(b=>b.onclick=()=>{state.need=b.dataset.n;support()});
}

function support(){
  let title,body;
  if(state.need==="understand"){
    title="Separate the result from the lesson.";
    body="The useful question is what actually went wrong — preparation, strategy, timing, support, circumstances — without turning the whole thing into a judgement about yourself.";
  } else if(state.need==="confidence"){
    title="Your confidence took a hit.";
    body="You don’t have to pretend this didn’t hurt. Confidence can also come from knowing that one result doesn’t get the final word.";
  } else {
    title="Make the future smaller.";
    body="You don’t need to solve the degree or the next year today. You only need to decide the next useful move.";
  }
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">For right now</div>
        <h2>${title}</h2>
        <p>${body}</p>
      </div>
      <button id="next" class="primary">Find my 1% step</button>
    </div>`);
  document.getElementById('next').onclick=onePercent;
}

function onePercent(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Your one percent</div>
        <h2>What would moving just 1% in the right direction look like today?</h2>
        <p class="sub">One small positive move. Nothing more.</p>
      </div>
      <div class="choices">
        <button class="choice s">Review my exam feedback and identify one recurring mistake</button>
        <button class="choice s">Spend 10 minutes working out what went wrong</button>
        <button class="choice s">Write down one thing I’ll change next time</button>
        <button class="choice s">Ask someone for help with the part I’m stuck on</button>
      </div>
      <textarea id="custom" placeholder="Or choose your own 1% step..."></textarea>
      <button id="next" class="primary">This is my step for today</button>
    </div>`);
  document.querySelectorAll('.s').forEach(b=>b.onclick=()=>document.getElementById('custom').value=b.textContent);
  document.getElementById('next').onclick=()=>{
    state.step=value('custom')||state.step;
    takeaway();
  };
}

function takeaway(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Before we leave this here</div>
        <h2>What do you want to take with you?</h2>
        <p class="sub">Here’s what I think might be worth remembering.</p>
      </div>
      <div class="softnote">
        <strong>What I’m taking with me</strong>
        <p>${state.takeaway}</p>
        <button id="editTake" class="editline">Edit</button>
      </div>
      <button id="next" class="primary">Keep going</button>
    </div>`);
  document.getElementById('editTake').onclick=editTakeaway;
  document.getElementById('next').onclick=resolution;
}

function editTakeaway(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Make it yours</div>
        <h2>What do you want to remember?</h2>
      </div>
      <textarea id="take">${state.takeaway}</textarea>
      <button id="next" class="primary">Save this thought</button>
    </div>`);
  document.getElementById('next').onclick=()=>{
    state.takeaway=value('take')||state.takeaway;
    resolution();
  };
}

function resolution(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">For today</div>
        <h2>You don’t have to solve the whole future tonight.</h2>
        <p class="sub">You’ve understood the fear more clearly and chosen one small way forward.</p>
      </div>

      <div class="softnote">
        <strong>What I’m taking with me</strong>
        <p>${state.takeaway}</p>
        <button id="editTake" class="editline">Edit</button>
      </div>

      <div class="softnote">
        <strong>My 1% step today</strong>
        <p>${state.step}</p>
        <button id="editStep" class="editline">Edit</button>
      </div>

      <button id="next" class="primary">Leave this in the Pensieve</button>
    </div>`);
  document.getElementById('editTake').onclick=editTakeawayFinal;
  document.getElementById('editStep').onclick=editStepFinal;
  document.getElementById('next').onclick=memory;
}

function editTakeawayFinal(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">One last change</div>
        <h2>What do you want to take with you?</h2>
      </div>
      <textarea id="take">${state.takeaway}</textarea>
      <button id="next" class="primary">Update it</button>
    </div>`);
  document.getElementById('next').onclick=()=>{
    state.takeaway=value('take')||state.takeaway;
    resolution();
  };
}

function editStepFinal(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">One last change</div>
        <h2>What’s your 1% step now?</h2>
        <p class="sub">If a better idea came to you while reflecting, use that instead.</p>
      </div>
      <textarea id="step">${state.step}</textarea>
      <button id="next" class="primary">Update my 1% step</button>
    </div>`);
  document.getElementById('next').onclick=()=>{
    state.step=value('step')||state.step;
    resolution();
  };
}

function memory(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Leave the memory?</div>
        <h2>Keep what mattered — not just what hurt.</h2>
        <p class="sub">If this feeling returns, Pensieve can bring back what you understood and what helped.</p>
      </div>
      <div class="end-actions">
        <button id="keep" class="primary">Keep this memory</button>
        <button id="fade" class="secondary">Let it fade</button>
      </div>
    </div>`);
  document.getElementById('keep').onclick=kept;
  document.getElementById('fade').onclick=home;
}

function kept(){
  render(`
    <div class="space-lg">
      <div class="stack">
        <div class="kicker">Memory kept</div>
        <h2>You can come back to this.</h2>
        <p class="sub">Not to relive the failure — to remember what you understood when you worked through it.</p>
      </div>
      <button id="home" class="primary">Return to Pensieve</button>
    </div>`);
  document.getElementById('home').onclick=home;
}

home();
</script>
</body>
</html>
